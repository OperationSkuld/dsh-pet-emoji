name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v1.0.0）。留空则只产出 artifact，不创建 Release。"
        required: false

permissions:
  contents: write

env:
  APP_NAME: dsh-pet-emoji
  FLUTTER_CHANNEL: stable

jobs:
  windows:
    name: Windows x64 (exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: 打包为 zip
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          $out = "$env:APP_NAME-windows-x64.zip"
          Compress-Archive -Path "$src/*" -DestinationPath $out -CompressionLevel Optimal
          Get-Item $out | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: ${{ env.APP_NAME }}-windows-x64.zip
          if-no-files-found: error

  android:
    name: Android (apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: 重命名产物
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk "$APP_NAME-android.apk"
          ls -lh "$APP_NAME-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ env.APP_NAME }}-android.apk
          if-no-files-found: error

  ios:
    name: iOS (unsigned ipa)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - run: flutter pub get

      - name: Build iOS（不签名）
        run: flutter build ios --release --no-codesign

      - name: 打包未签名 ipa
        run: |
          cd build/ios/iphoneos
          rm -rf Payload && mkdir Payload
          cp -R Runner.app Payload/
          zip -qry "../../../$APP_NAME-ios-unsigned.ipa" Payload
          cd ../../..
          ls -lh "$APP_NAME-ios-unsigned.ipa"

      - name: 附上 .app 目录（便于自行签名）
        run: |
          cd build/ios/iphoneos
          zip -qry "../../../$APP_NAME-ios-app.zip" Runner.app

      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned
          path: |
            ${{ env.APP_NAME }}-ios-unsigned.ipa
            ${{ env.APP_NAME }}-ios-app.zip
          if-no-files-found: error

  release:
    name: 汇总发布
    needs: [windows, android, ios]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 整理发布文件
        run: |
          mkdir -p dist
          cp artifacts/windows-x64/*.zip dist/
          cp artifacts/android-apk/*.apk dist/
          cp artifacts/ios-unsigned/*.ipa dist/
          cp artifacts/ios-unsigned/*.zip dist/
          ls -lh dist

      - name: 生成 Release Note 附录
        run: cp docs/release-notes-template.md dist/RELEASE-NOTES.md

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: dsh-pet-emoji ${{ github.ref_name }}
          body_path: dist/RELEASE-NOTES.md
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.apk
            dist/*.ipa
          fail_on_unmatched_files: false
